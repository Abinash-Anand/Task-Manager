<div class="container mx-auto p-4 max-w-4xl">

  <!-- App Header Section -->
  <header class="mb-6">
    <h2 class="text-2xl font-bold">{{ appName() }}</h2>
    <p class="text-sm">Notifications: {{ notificationCount() }}</p>
    @if (greetingsEventValue()) {
      <h3 class="text-md font-medium mt-1">{{ greetingsEventValue() }}</h3>
    }
  </header>

  <!-- Metrics Dashboard Grid Block -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 border border-black p-4 mb-6">
    @for (card of cardComponentDataObject(); track card.cardHeading) {
      <app-content-card [cardComponent]="card"></app-content-card>
    }
  </div>

  <!-- Primary Task List Showcase Block -->
  <div class="mb-6">
    <app-content-card [cardComponent]="taskListCardDataObject()"
      (actionClick)="toggleTaskStatus($event)"
    ></app-content-card>
  </div>

  <!-- Dashboard Functional Operation Controls Panel -->
  <div class="flex flex-col gap-2 max-w-xs mb-8">
    <button type="button" class="px-3 py-1.5 border border-black text-sm font-medium hover:bg-gray-50" 
      (click)="changeTaskStatusToComplete()">
      Mark as Completed
    </button>
    
    <div class="flex gap-2">
      <button type="button" class="flex-1 px-3 py-1.5 border border-black text-sm hover:bg-gray-50" (click)="increaseNotifications()">
        Increase notification
      </button>
      <button type="button" class="flex-1 px-3 py-1.5 border border-black text-sm hover:bg-gray-50" (click)="resetNotification()">
        Reset Notification
      </button>
    </div>
  </div>

  <!-- User Details Profile Interaction Card Section -->
  <section class="border-t border-black pt-4">
    <app-user-card
      [userName]="userName()"
      (greetings)="displayGreetings($event)"
    ></app-user-card>
  </section>

</div>
